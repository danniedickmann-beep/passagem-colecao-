<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Nexus — Dashboard operacional inspirado na Stripe</title>
  <desc>Segunda tela do fluxo Nexus: dashboard com indicadores, riscos, ações rápidas e apontamentos.</desc>
  <defs>
    <linearGradient id="nav-bg" x1="0" y1="0" x2="260" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A2540"/>
      <stop offset="1" stop-color="#071B30"/>
    </linearGradient>
    <linearGradient id="page-wash" x1="260" y1="0" x2="1370" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F9FC"/>
      <stop offset="0.65" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F5FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#635BFF"/>
      <stop offset="1" stop-color="#5146E5"/>
    </linearGradient>
    <linearGradient id="cyan-bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#635BFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="nexus-mark-dashboard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#80E9FF"/>
      <stop offset="0.55" stop-color="#B8A8FF"/>
      <stop offset="1" stop-color="#FF9DD5"/>
    </linearGradient>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0A2540" flood-opacity="0.06"/>
    </filter>
    <filter id="button-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#635BFF" flood-opacity="0.22"/>
    </filter>
  </defs>

