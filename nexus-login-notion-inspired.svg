<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Nexus — Login inspirado no Notion</title>
  <desc>Quinta proposta de login Nexus com linguagem editorial, humana e baseada em documentos.</desc>
  <defs>
    <filter id="paper-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="25" flood-color="#282621" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#282621" flood-opacity="0.07"/>
    </filter>
  </defs>

  <g id="05 — Login / Notion Inspired">
    <rect width="1440" height="900" fill="#F7F6F2"/>

    <g id="Top Annotation">
      <text x="56" y="55" fill="#78756F" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">05 / NOTION-INSPIRED</text>
      <text x="56" y="76" fill="#A09C94" font-family="Inter, Arial, sans-serif" font-size="10.5">Editorial • human • document-first</text>
    </g>

    <g id="Decorative Doodles" stroke="#CBC7BE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M112 180C142 153 174 163 187 186C198 205 187 231 160 232C135 233 117 216 126 198C134 182 157 178 171 192"/>
      <path d="M1227 690L1252 664L1278 690L1304 664"/>
      <path d="M1217 720H1314"/>
      <path d="M1217 732H1270"/>
      <path d="M1185 160C1212 160 1234 182 1234 209C1234 236 1212 258 1185 258"/>
      <path d="M1185 176C1203 176 1218 191 1218 209C1218 227 1203 242 1185 242"/>
      <path d="M243 735L257 721L271 735L285 721L299 735"/>
    </g>

    <g id="Main Composition">
      <g id="Document Preview" filter="url(#paper-shadow)">
        <rect x="176" y="148" width="494" height="604" rx="8" fill="#FFFFFF"/>
        <rect x="176.5" y="148.5" width="493" height="603" rx="7.5" stroke="#D9D6CF"/>

        <g id="Document Header">
          <text x="220" y="208" fill="#363430" font-family="Inter, Arial, sans-serif" font-size="12">🧵</text>
          <text x="246" y="208" fill="#77736C" font-family="Inter, Arial, sans-serif" font-size="10.5">Coleções / Inverno 27</text>
          <text x="220" y="269" fill="#25231F" font-family="Georgia, Times New Roman, serif" font-size="33" font-weight="700" letter-spacing="-0.8">Passagem de coleção</text>
          <text x="220" y="302" fill="#77736C" font-family="Inter, Arial, sans-serif" font-size="12.5">Registro central de decisões, responsáveis e próximos passos.</text>
        </g>

        <g id="Document Properties">
          <path d="M220 336H626" stroke="#E6E3DD"/>
          <text x="220" y="368" fill="#8E8A82" font-family="Inter, Arial, sans-serif" font-size="10">Status</text>
          <rect x="306" y="351" width="96" height="24" rx="5" fill="#EAF4ED"/>
          <text x="354" y="367" text-anchor="middle" fill="#477057" font-family="Inter, Arial, sans-serif" font-size="9.5">Em andamento</text>
          <text x="220" y="408" fill="#8E8A82" font-family="Inter, Arial, sans-serif" font-size="10">Responsável</text>
          <circle cx="318" cy="404" r="11" fill="#F4DFC0"/>
          <text x="318" y="407.5" text-anchor="middle" fill="#865B22" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="650">DD</text>
          <text x="338" y="408" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="10.5">Daniela Dickmann</text>
          <path d="M220 430H626" stroke="#E6E3DD"/>
        </g>

        <g id="Document Checklist">
          <text x="220" y="475" fill="#25231F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Checklist de passagem</text>
          <g id="Check 1">
            <rect x="220.5" y="499.5" width="17" height="17" rx="4" fill="#25231F"/>
            <path d="M225 508L228.5 511.5L234 505.5" stroke="#FFFFFF" stroke-width="1.5"/>
            <text x="250" y="513" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="11.5">Ficha técnica revisada</text>
          </g>
          <g id="Check 2">
            <rect x="220.5" y="535.5" width="17" height="17" rx="4" fill="#25231F"/>
            <path d="M225 544L228.5 547.5L234 541.5" stroke="#FFFFFF" stroke-width="1.5"/>
            <text x="250" y="549" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="11.5">Mostruário validado</text>
          </g>
          <g id="Check 3">
            <rect x="220.5" y="571.5" width="17" height="17" rx="4" fill="#FFFFFF"/>
            <rect x="220.5" y="571.5" width="17" height="17" rx="4" stroke="#C9C5BD"/>
            <text x="250" y="585" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="11.5">Decisão final registrada</text>
          </g>
        </g>

        <g id="Document Note">
          <rect x="220" y="626" width="406" height="76" rx="6" fill="#F7F6F2"/>
          <rect x="220.5" y="626.5" width="405" height="75" rx="5.5" stroke="#E4E0D8"/>
          <text x="240" y="652" fill="#8B877F" font-family="Inter, Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.7">PRÓXIMO PASSO</text>
          <text x="240" y="678" fill="#45423D" font-family="Inter, Arial, sans-serif" font-size="11.5">Consolidar ajustes antes da reunião de aprovação.</text>
        </g>
      </g>

      <g id="Login Card" filter="url(#card-shadow)">
        <rect x="770" y="148" width="494" height="604" rx="14" fill="#FFFFFF"/>
        <rect x="770.5" y="148.5" width="493" height="603" rx="13.5" stroke="#D9D6CF"/>

        <g id="Nexus Brand" transform="translate(818 193)">
          <rect width="42" height="42" rx="7" fill="#FFFFFF"/>
          <rect x="0.5" y="0.5" width="41" height="41" rx="6.5" stroke="#25231F"/>
          <path d="M10 31V11L32 31V11" stroke="#25231F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="10" cy="11" r="2.7" fill="#25231F"/>
          <circle cx="10" cy="31" r="2.7" fill="#25231F"/>
          <circle cx="32" cy="11" r="2.7" fill="#25231F"/>
          <circle cx="32" cy="31" r="2.7" fill="#25231F"/>
          <text x="56" y="18" fill="#25231F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="680">Nexus</text>
          <text x="56" y="34" fill="#8B877F" font-family="Inter, Arial, sans-serif" font-size="8.5" font-weight="550" letter-spacing="0.6">PASSAGEM DE COLEÇÃO DIGITAL</text>
        </g>

        <g id="Login Introduction">
          <text x="818" y="302" fill="#25231F" font-family="Georgia, Times New Roman, serif" font-size="31" font-weight="700" letter-spacing="-0.5">Acesse seu espaço de trabalho</text>
          <text x="818" y="335" fill="#77736C" font-family="Inter, Arial, sans-serif" font-size="12.5">Identifique-se para continuar de onde parou.</text>
        </g>

        <g id="Name Field">
          <text x="818" y="386" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Nome completo</text>
          <rect x="818.5" y="400.5" width="397" height="47" rx="6.5" fill="#FFFFFF"/>
          <rect x="818.5" y="400.5" width="397" height="47" rx="6.5" stroke="#CFCBC3"/>
          <text x="833" y="430" fill="#A09C94" font-family="Inter, Arial, sans-serif" font-size="12.5">Seu nome completo</text>
        </g>

        <g id="Profile Field">
          <text x="818" y="482" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Perfil</text>
          <rect x="818.5" y="496.5" width="397" height="47" rx="6.5" fill="#FFFFFF"/>
          <rect x="818.5" y="496.5" width="397" height="47" rx="6.5" stroke="#CFCBC3"/>
          <text x="833" y="526" fill="#A09C94" font-family="Inter, Arial, sans-serif" font-size="12.5">Selecione seu perfil</text>
          <path d="M1188 517L1193 522L1198 517" stroke="#77736C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g id="Primary Action">
          <rect x="818" y="578" width="398" height="48" rx="7" fill="#25231F"/>
          <text x="1017" y="608" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="600">Acessar a coleção</text>
        </g>

        <g id="Login Footer">
          <path d="M818 665H1216" stroke="#E5E1DA"/>
          <text x="818" y="696" fill="#969189" font-family="Inter, Arial, sans-serif" font-size="10">🔒 Acesso seguro e rastreável</text>
          <text x="1216" y="696" text-anchor="end" fill="#57534D" font-family="Inter, Arial, sans-serif" font-size="10" text-decoration="underline">Precisa de ajuda?</text>
        </g>
      </g>
    </g>
  </g>
</svg>
