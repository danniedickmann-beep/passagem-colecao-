<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Nexus — Cadastro de artigo</title><desc>Segunda tela do fluxo de artigos: formulário de preparação da passagem.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="900"><stop stop-color="#F7F6F3"/><stop offset="1" stop-color="#F1F0ED"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7057EB"/><stop offset="1" stop-color="#8065ED"/></linearGradient>
    <filter id="modal-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="40" flood-color="#292529" flood-opacity="0.18"/></filter>
  </defs>
  <g id="04 — Artigos / Cadastrar">
    <rect width="1440" height="900" fill="url(#page)"/>
    <g opacity="0.4"><rect x="26.5" y="26.5" width="1387" height="847" rx="22.5" fill="#FCFBF9" stroke="#DFDCD7"/><path d="M262.5 27V873" stroke="#D9D5D0"/><rect x="42" y="199" width="192" height="42" rx="9" fill="#F0ECFF"/><rect x="300" y="160" width="680" height="34" rx="8" fill="#E9E6E1"/><rect x="300" y="220" width="1062" height="92" rx="12" fill="#FFFFFF" stroke="#DFDCD7"/><rect x="300" y="340" width="1062" height="410" rx="13" fill="#FFFFFF" stroke="#DFDCD7"/></g>
    <rect width="1440" height="900" fill="#292529" fill-opacity="0.30"/>

    <g id="Article Form Modal" transform="translate(280 38)" filter="url(#modal-shadow)" font-family="Inter, Arial">
      <rect width="880" height="824" rx="18" fill="#FCFBF9"/>
      <rect x="0.5" y="0.5" width="879" height="823" rx="17.5" stroke="#DEDAD5"/>
      <g id="Header"><text x="36" y="31" fill="#8278B6" font-size="8" font-weight="700" letter-spacing="1.1">PREPARAÇÃO DA PASSAGEM</text><text x="36" y="65" fill="#292628" font-size="24" font-weight="700" letter-spacing="-0.5">Cadastrar artigo</text><text x="36" y="87" fill="#8F8A86" font-size="10">Preencha os dados que acompanharão o artigo durante todo o fluxo.</text><rect x="817" y="26" width="36" height="36" rx="9" fill="#F5F2EE"/><path d="M829 38L841 50M841 38L829 50" stroke="#77716E" stroke-width="1.4"/><path d="M0 108H880" stroke="#E5E1DC"/></g>

      <g id="Form" transform="translate(36 132)">
        <g id="Article Code"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Código do artigo *</text><rect x="0.5" y="20.5" width="807" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="14" y="47" fill="#AAA5A0" font-size="10">Digite o código do artigo</text></g>

        <g transform="translate(0 84)"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Coleção *</text><rect x="0.5" y="20.5" width="391" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="14" y="47" fill="#77716E" font-size="10">INVERNO 27</text><path d="M363 36L368 41L373 36" stroke="#918C88"/><text x="416" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Linha</text><rect x="416.5" y="20.5" width="391" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="430" y="47" fill="#AAA5A0" font-size="10">Selecione uma linha</text><path d="M779 36L784 41L789 36" stroke="#918C88"/></g>

        <g transform="translate(0 168)"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Categoria</text><rect x="0.5" y="20.5" width="391" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="14" y="47" fill="#AAA5A0" font-size="10">Selecione uma categoria</text><path d="M363 36L368 41L373 36" stroke="#918C88"/><text x="416" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Matéria-prima base</text><rect x="416.5" y="20.5" width="391" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="430" y="47" fill="#AAA5A0" font-size="10">Selecione uma matéria-prima</text><path d="M779 36L784 41L789 36" stroke="#918C88"/></g>

        <g transform="translate(0 252)"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Classificação</text><rect x="0.5" y="20.5" width="183" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="14" y="47" fill="#77716E" font-size="10">Nova</text><path d="M155 36L160 41L165 36" stroke="#918C88"/><text x="208" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Criticidade</text><rect x="208.5" y="20.5" width="183" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="222" y="47" fill="#77716E" font-size="10">Baixa</text><path d="M363 36L368 41L373 36" stroke="#918C88"/><text x="416" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Lacre</text><rect x="416.5" y="20.5" width="183" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="430" y="47" fill="#AAA5A0" font-size="10">Selecione</text><path d="M571 36L576 41L581 36" stroke="#918C88"/><text x="624" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Mostruário *</text><rect x="624.5" y="20.5" width="183" height="42" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="638" y="47" fill="#AAA5A0" font-size="10">Selecione</text><path d="M779 36L784 41L789 36" stroke="#918C88"/></g>

        <g id="Attention" transform="translate(0 342)"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Pontos de atenção previstos</text><text x="127" y="9" fill="#AAA5A0" font-size="8">selecione quantos precisar</text><g transform="translate(0 23)"><rect width="83" height="28" rx="8" fill="#F5F2EE" stroke="#DFDAD4"/><rect x="10" y="9" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#AAA5A0"/><text x="28" y="18" fill="#6E6965" font-size="8.5">Modelagem</text><rect x="93" width="82" height="28" rx="8" fill="#F5F2EE" stroke="#DFDAD4"/><rect x="103" y="9" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#AAA5A0"/><text x="121" y="18" fill="#6E6965" font-size="8.5">Costura</text><rect x="185" width="97" height="28" rx="8" fill="#F5F2EE" stroke="#DFDAD4"/><rect x="195" y="9" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#AAA5A0"/><text x="213" y="18" fill="#6E6965" font-size="8.5">Acabamento</text><rect x="292" width="105" height="28" rx="8" fill="#F5F2EE" stroke="#DFDAD4"/><rect x="302" y="9" width="10" height="10" rx="2" fill="#FFFFFF" stroke="#AAA5A0"/><text x="320" y="18" fill="#6E6965" font-size="8.5">Matéria-prima</text></g></g>

        <g id="Uploads" transform="translate(0 414)"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Imagem do artigo</text><rect x="0.5" y="20.5" width="391" height="76" rx="9.5" fill="#FAF8F5" stroke="#CFCAC4" stroke-dasharray="5 4"/><path d="M36 45V66M27 54L36 45L45 54" stroke="#8F8A86" stroke-width="1.3"/><text x="59" y="53" fill="#625D59" font-size="9.5" font-weight="600">Escolher imagem</text><text x="59" y="70" fill="#AAA5A0" font-size="8">JPG ou PNG · máximo 10 MB</text><text x="416" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Anexos do artigo</text><rect x="416.5" y="20.5" width="391" height="76" rx="9.5" fill="#FAF8F5" stroke="#CFCAC4" stroke-dasharray="5 4"/><path d="M452 45V66M443 54L452 45L461 54" stroke="#8F8A86" stroke-width="1.3"/><text x="475" y="53" fill="#625D59" font-size="9.5" font-weight="600">Arraste arquivos ou clique</text><text x="475" y="70" fill="#AAA5A0" font-size="8">Imagem, vídeo, PDF ou texto · até 50 MB</text></g>

        <g id="Notes" transform="translate(0 532)"><text x="0" y="9" fill="#5F5A57" font-size="8.5" font-weight="650">Apontamentos para a passagem</text><rect x="0.5" y="20.5" width="807" height="72" rx="8.5" fill="#FFFFFF" stroke="#CFCAC4"/><text x="14" y="45" fill="#AAA5A0" font-size="9.5">Registre observações técnicas, cuidados ou contexto para a apresentação.</text></g>
      </g>

      <g id="Footer" transform="translate(0 757)"><path d="M0 0H880" stroke="#E5E1DC"/><text x="36" y="39" fill="#99948F" font-size="8">* Campos obrigatórios</text><g transform="translate(610 18)"><rect x="0.5" y="0.5" width="102" height="42" rx="8.5" fill="#FFFFFF" stroke="#DDD9D3"/><text x="51" y="26" text-anchor="middle" fill="#625D59" font-size="9.5" font-weight="600">Cancelar</text><rect x="116" width="126" height="43" rx="9" fill="url(#purple)"/><text x="179" y="26" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="650">Salvar artigo</text></g></g>
    </g>
  </g>
</svg>
